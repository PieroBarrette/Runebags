<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mesure d'audience — RuneBags</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#131820">
  <link rel="icon" type="image/svg+xml" href="/assets/RuneBags_Logo.svg">
  <link rel="stylesheet" href="/styles/page.css">
  <script>
    // The theme chosen in the game, before first paint.
    try {
      if (localStorage.getItem("runebags-theme-v1") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) { /* private mode: keep the dark default */ }
  </script>
  <script type="module" src="/js/admin/metricsPage.js"></script>
</head>
<body>
  <header class="page-header">
    <a class="page-brand" href="/"><img src="/assets/RuneBags_Logo.svg" alt="" width="40" height="40">RuneBags</a>
  </header>

  <main class="page">
    <h1>Mesure d'audience</h1>
    <p class="page-updated">Totaux anonymes par jour, à l'heure du Québec.</p>

    <div class="metrics-controls">
      <label for="metrics-days">Période</label>
      <select id="metrics-days">
        <option value="7">7 derniers jours</option>
        <option value="30" selected>30 derniers jours</option>
        <option value="90">90 derniers jours</option>
        <option value="366">12 derniers mois</option>
      </select>
    </div>
    <p id="metrics-message" class="metrics-message" role="status"></p>

    <div id="metrics-content" hidden>
      <h2>Le parcours</h2>
      <div id="metrics-tiles" class="metrics-tiles"></div>

      <h2>Par jour</h2>
      <div class="metrics-table-wrap"><table id="metrics-daily" class="metrics-table"></table></div>

      <h2>D'où viennent les visites</h2>
      <div class="metrics-table-wrap"><table id="metrics-sources" class="metrics-table"></table></div>

      <h2>Parties contre l'IA, par niveau</h2>
      <div class="metrics-table-wrap"><table id="metrics-levels" class="metrics-table"></table></div>

      <h2>Résultats et langues</h2>
      <div class="metrics-table-wrap"><table id="metrics-other" class="metrics-table"></table></div>
    </div>
  </main>
</body>
</html>
