<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — RuneBags</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#131820">
  <link rel="icon" type="image/svg+xml" href="/assets/RuneBags_Logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/page.css">
  <script>
    // The theme chosen in the game, before first paint.
    try {
      if (localStorage.getItem("runebags-theme-v1") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) { /* private mode: keep the dark default */ }
  </script>
</head>
<body>
  <header class="page-header">
    <a class="page-brand" href="/"><img src="/assets/RuneBags_Logo.svg" alt="" width="40" height="40">RuneBags</a>
  </header>

  <main class="page page-notfound">
    <section>
      <h1>Page introuvable</h1>
      <p>Cette page n'existe pas. Elle a peut-être été déplacée, ou l'adresse contient une faute.</p>
      <a class="page-cta" href="/">Retour au jeu</a>
    </section>
    <section lang="en">
      <h1>Page not found</h1>
      <p>This page doesn't exist. It may have moved, or the address has a typo.</p>
      <a class="page-cta" href="/">Back to the game</a>
    </section>
  </main>
</body>
</html>
